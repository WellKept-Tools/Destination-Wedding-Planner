<script>
(()=>{'use strict';

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),today=()=>new Date().toISOString().slice(0,10),future=(d)=>{let x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)};
const defs={
 destinations:{title:'Destinations & Venues',singular:'Destination',icon:'◇',section:'Wedding Planning',desc:'Compare dream locations, venues, capacity and travel fit.',fields:[['name','Destination / venue','text',1],['location','Location','text',1],['status','Status','select','Shortlisted|Contacted|Selected'],['capacity','Capacity','number'],['cost','Estimated cost','number'],['notes','Notes','textarea']]},
 budget:{title:'Budget',singular:'Expense',icon:'€',section:'Wedding Planning',desc:'Keep every beautiful detail within a clear financial plan.',fields:[['name','Expense','text',1],['category','Category','select','Venue|Catering|Attire|Travel|Florals|Photography|Entertainment|Other'],['planned','Planned','number',1],['actual','Actual / paid','number'],['due','Payment due','date'],['status','Status','select','Planned|Deposit paid|Paid']]},
 guests:{title:'Guests & RSVP',singular:'Guest',icon:'♙',section:'Wedding Planning',desc:'Manage invitations, responses, dietary needs and travel.',fields:[['name','Guest name','text',1],['group','Household / group','text'],['rsvp','RSVP','select','Pending|Attending|Declined'],['diet','Dietary needs','text'],['travel','Travel status','select','Not started|Planning|Booked'],['email','Email','email']]},
 timeline:{title:'Wedding Timeline',singular:'Task',icon:'✓',section:'Overview',desc:'Turn the journey into calm, beautifully organized steps.',fields:[['name','Task','text',1],['category','Category','select','Planning|Venue|Guests|Style|Travel|Legal|Wedding day'],['due','Due date','date',1],['status','Status','select','To do|In progress|Complete'],['assignee','Assigned to','select','Partner 1|Partner 2|Both|Wedding Planner|Other'],['notes','Notes','textarea']]},
 calendar:{title:'Calendar',singular:'Event',icon:'▦',section:'Overview',desc:'See tasks, appointments and celebrations together.',fields:[['name','Calendar item','text',1],['date','Date','date',1],['time','Time','time'],['type','Type','select','Appointment|Deadline|Celebration|Travel'],['notes','Notes','textarea']]},
 travel:{title:'Travel & Hotels',singular:'Booking',icon:'✈',section:'Travel & Preparation',desc:'Coordinate flights, transfers, stays and guest logistics.',fields:[['name','Booking / route','text',1],['type','Type','select','Flight|Hotel|Transfer|Train|Rental car'],['date','Date','date'],['provider','Provider','text'],['confirmation','Confirmation','text'],['cost','Cost','number']]},
 vendors:{title:'Vendors',singular:'Vendor',icon:'♧',section:'Wedding Planning',desc:'Track the trusted team bringing your vision to life.',fields:[['name','Vendor name','text',1],['category','Category','select','Planner|Photographer|Florist|Catering|Music|Beauty|Transport|Other'],['status','Status','select','Researching|Contacted|Quoted|Booked'],['contact','Contact','text'],['cost','Contract value','number'],['payment','Next payment','date']]},
 vision:{title:'Vision Board',singular:'Inspiration',icon:'❀',section:'Wedding Style',desc:'Gather colors, textures and ideas for one cohesive story.',premium:'preview',fields:[['name','Inspiration title','text',1],['category','Category','select','Palette|Florals|Attire|Tablescape|Venue|Details'],['color','Color','color'],['notes','Notes','textarea']]},
 events:{title:'Multi-day Events',singular:'Event',icon:'♢',section:'Wedding Planning',desc:'Plan welcome dinners, ceremonies, brunches and every gathering.',fields:[['name','Event name','text',1],['date','Date','date',1],['time','Start time','time'],['venue','Venue','text'],['guests','Expected guests','number'],['notes','Notes','textarea']]},
 seating:{title:'Seating Chart',singular:'Table',icon:'◎',section:'Wedding Planning',desc:'Shape a thoughtful room with balanced, comfortable tables.',premium:'preview',fields:[['name','Table name','text',1],['capacity','Capacity','number',1],['shape','Shape','select','Round|Rectangle|Oval|Sweetheart'],['guests','Guest names','textarea']]},
 documents:{title:'Documents',singular:'Document',icon:'▤',section:'Travel & Preparation',desc:'Keep legal, identity and ceremony paperwork on track.',fields:[['name','Document','text',1],['owner','Owner','select','Partner 1|Partner 2|Both|Guest'],['status','Status','select','Needed|Requested|Ready|Complete'],['due','Due date','date'],['notes','Notes','textarea']]},
 emergency:{title:'Emergency Planning',singular:'Plan item',icon:'✦',section:'Travel & Preparation',desc:'Prepare contacts, weather alternatives and calm contingencies.',fields:[['name','Plan / contact','text',1],['type','Type','select','Weather|Medical|Vendor backup|Travel|Contact'],['contact','Contact details','text'],['status','Status','select','Draft|Confirmed|Ready'],['notes','Notes','textarea']]},
 invitations:{title:'Invitation Studio',singular:'Communication',icon:'✉',section:'Wedding Style',desc:'Craft elegant guest messages and invitation wording.',fields:[['name','Piece / message','text',1],['template','Template','select','Pearl Classic|Blush Ribbon|Lake Como|Midnight Coquette'],['audience','Audience','select','All guests|Wedding party|Family|Custom group'],['status','Status','select','Draft|Ready|Sent'],['message','Wording','textarea']]},
 packing:{title:'Packing',singular:'Packing item',icon:'▣',section:'Travel & Preparation',desc:'Pack with confidence for every person and occasion.',fields:[['name','Item','text',1],['bag','Bag / person','text'],['category','Category','select','Attire|Documents|Beauty|Ceremony|Technology|Emergency'],['status','Status','select','To pack|Packed'],['notes','Notes','textarea']]},
 honeymoon:{title:'Honeymoon',singular:'Honeymoon plan',icon:'☼',section:'After the Wedding',desc:'Collect your romantic next-adventure ideas in one place.',premium:'preview',fields:[['name','Activity / stay','text',1],['location','Location','text'],['date','Date','date'],['status','Status','select','Idea|Shortlisted|Booked'],['cost','Cost','number'],['notes','Notes','textarea']]},
 memories:{title:'Memories',singular:'Memory',icon:'♡',section:'After the Wedding',desc:'Preserve the stories, gratitude and details worth keeping.',fields:[['name','Memory title','text',1],['date','Date','date'],['type','Type','select','Moment|Photo note|Thank you|Keepsake'],['notes','Story','textarea']]},
 decisions:{title:'Decision Journal',singular:'Decision',icon:'⌁',section:'Overview',desc:'Remember what you chose, why it mattered and who owns it.',fields:[['name','Decision title','text',1],['options','Options considered','textarea'],['choice','Selected choice','text',1],['reason','Reason','textarea'],['date','Decision date','date'],['owner','Responsible','select','Partner 1|Partner 2|Both|Wedding Planner|Other']]}
};
const limits={guests:15,timeline:10,vendors:3,budget:5,events:2,destinations:2,travel:3};
function sample(){return {schema:1,profile:{couple:'Olivia & James',destination:'Lake Como, Italy',style:'Romantic Coquette',currency:'EUR',date:future(280),budget:65000},prefs:{theme:'system',reduced:false},destinations:[{id:uid(),name:'Villa Serafina',location:'Lake Como, Italy',status:'Selected',capacity:92,cost:18000,notes:'Lake terrace ceremony'}],budget:[['Villa deposit','Venue',18000,6000],['Photography','Photography',5500,1500],['Floral design','Florals',7200,0],['Welcome dinner','Catering',8500,2500]].map(x=>({id:uid(),name:x[0],category:x[1],planned:x[2],actual:x[3],due:future(70),status:x[3]?'Deposit paid':'Planned'})),guests:[['Sofia Bennett','Attending'],['Theo Bennett','Attending'],['Amelia Hart','Pending'],['Noah Clarke','Attending'],['Isla Morgan','Declined'],['Leo Morgan','Pending']].map(x=>({id:uid(),name:x[0],group:'Family & friends',rsvp:x[1],diet:'',travel:x[1]==='Attending'?'Planning':'Not started',email:''})),timeline:[['Confirm floral proposal',35,'In progress'],['Send save the dates',14,'Complete'],['Review menu tasting',62,'To do'],['Book guest transfers',91,'To do'],['Finalize ceremony music',110,'To do']].map(x=>({id:uid(),name:x[0],category:'Planning',due:future(x[1]),status:x[2],assignee:'Both',notes:''})),calendar:[{id:uid(),name:'Menu tasting',date:future(62),time:'14:00',type:'Appointment',notes:''}],travel:[{id:uid(),name:'Couple flights to Milan',type:'Flight',date:future(272),provider:'ITA Airways',confirmation:'Draft',cost:780}],vendors:[['Bianca Rossi','Planner','Booked',6200],['Luna Botanica','Florist','Quoted',7200],['Mira & Co.','Photographer','Booked',5500]].map(x=>({id:uid(),name:x[0],category:x[1],status:x[2],contact:'hello@example.com',cost:x[3],payment:future(80)})),vision:[{id:uid(),name:'Pearl & ballet pink palette',category:'Palette',color:'#ebc6d0',notes:'Soft ivory, blush and champagne'}],events:[{id:uid(),name:'Welcome dinner',date:future(278),time:'19:00',venue:'Villa garden',guests:72,notes:'Italian garden evening'},{id:uid(),name:'Wedding ceremony',date:future(280),time:'16:00',venue:'Lake terrace',guests:86,notes:''}],seating:[{id:uid(),name:'Table Fleur',capacity:8,shape:'Round',guests:'Sofia, Theo, Amelia, Noah'}],documents:[{id:uid(),name:'Marriage documentation',owner:'Both',status:'Requested',due:future(150),notes:''}],emergency:[{id:uid(),name:'Rain ceremony alternative',type:'Weather',contact:'Villa coordinator',status:'Confirmed',notes:'Glass orangery reserved'}],invitations:[{id:uid(),name:'Save the date',template:'Pearl Classic',audience:'All guests',status:'Sent',message:'Join us by the lake…'}],packing:[{id:uid(),name:'Wedding attire',bag:'Garment case',category:'Attire',status:'To pack',notes:''}],honeymoon:[{id:uid(),name:'Cliffside dinner',location:'Amalfi Coast',date:future(286),status:'Shortlisted',cost:250,notes:''}],memories:[],decisions:[{id:uid(),name:'Ceremony setting',options:'Garden, terrace, chapel',choice:'Lake terrace',reason:'The water view feels uniquely us',date:today(),owner:'Both'}]};}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||sample()}catch(e){state=sample()}Object.keys(defs).forEach(k=>state[k]??=[]);
let current='dashboard',editing=null,lastFocus=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Storage is full. Export a backup soon.','error')}}
function money(v){return new Intl.NumberFormat(undefined,{style:'currency',currency:state.profile.currency||'EUR',maximumFractionDigits:0}).format(Number(v)||0)}
function niceDate(v){if(!v)return'—';let d=new Date(v+'T00:00:00');return isNaN(d)?'—':d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function days(){return Math.ceil((new Date(state.profile.date)-new Date())/86400000)}
function readiness(){let task=state.timeline.length?state.timeline.filter(x=>x.status==='Complete').length/state.timeline.length:0,bud=state.profile.budget?Math.min(1,state.budget.reduce((a,x)=>a+(+x.planned||0),0)/state.profile.budget):0,rsvp=state.guests.length?state.guests.filter(x=>!['Pending','Invited','Not Invited'].includes(x.rsvp)).length/state.guests.length:0,vend=state.vendors.length?state.vendors.filter(x=>x.status==='Booked').length/Math.max(5,state.vendors.length):0,travel=state.travel.length?Math.min(1,state.travel.length/3):0;return Math.round((task+bud+rsvp+vend+travel)*20)}
function toast(msg){let n=document.createElement('div');n.className='toast';n.textContent=msg;$('#toasts').append(n);setTimeout(()=>n.remove(),3200)}
const sections=['Overview','Wedding Planning','Wedding Style','Travel & Preparation','After the Wedding'];
function nav(){let html='',menu=$('#nav'),scrollPosition=menu.scrollTop;sections.forEach(sec=>{html+=`<div class="nav-section">${sec}</div>`;if(sec==='Overview')html+=navBtn('dashboard','⌂','Dashboard');Object.entries(defs).filter(([,d])=>d.section===sec).forEach(([k,d])=>html+=navBtn(k,d.icon,d.title))});menu.innerHTML=html;menu.scrollTop=scrollPosition;$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function navBtn(k,i,t){return `<button class="nav-item ${current===k?'active':''}" data-go="${k}" title="${esc(t)}"><span class="ico">${i}</span><span class="nav-label">${esc(t)}</span></button>`}
function go(k){current=k;editing=null;render();$('#sidebar').classList.remove('mobile-open');$('#drawerBack').classList.remove('open');window.scrollTo(0,0)}
function render(){nav();$('#pageTitle').textContent=current==='dashboard'?'Dashboard':current==='settings'?'Settings':defs[current]?.title||'Dashboard';$('#headerDate').textContent=niceDate(state.profile.date);$('#content').innerHTML=current==='dashboard'?dashboard():current==='settings'?settings():current==='calendar'?moduleView('calendar',true):moduleView(current);bind();}
function dashboard(){let invited=state.guests.length,att=state.guests.filter(x=>['Attending','Confirmed'].includes(x.rsvp)).length,complete=state.timeline.filter(x=>x.status==='Complete').length,spent=state.budget.reduce((a,x)=>a+(+x.actual||0),0),planned=state.budget.reduce((a,x)=>a+(+x.planned||0),0),score=readiness();return `<section class="view active"><div class="hero glass"><div><span class="eyebrow">${esc(state.profile.destination)}</span><h2>${esc(state.profile.couple)} are getting married</h2><p>Your destination celebration is taking shape—one thoughtful decision, shared meal and beautiful detail at a time.</p><button class="btn primary" data-go="timeline">Continue planning</button></div><div class="countdown"><strong>${Math.max(0,days())}</strong><span>days until ${niceDate(state.profile.date)}</span><div class="pearl-line">${'<i class="pearl"></i>'.repeat(7)}</div></div></div>
<div class="grid stats"><div class="stat glass"><span>Guests attending</span><strong>${att}<small> / ${invited}</small></strong><small>${invited?Math.round(att/invited*100):0}% confirmed</small></div><div class="stat glass"><span>Budget planned</span><strong>${money(planned)}</strong><small>${money(spent)} paid</small></div><div class="stat glass"><span>Tasks complete</span><strong>${complete}<small> / ${state.timeline.length}</small></strong><small>Keep the calm momentum</small></div><div class="stat glass"><span>Vendors booked</span><strong>${state.vendors.filter(x=>x.status==='Booked').length}<small> / ${state.vendors.length}</small></strong><small>Creative team progress</small></div></div>
<div class="grid two"><div class="card glass"><div class="card-head"><h3>Next beautiful steps</h3><button class="tiny" data-go="timeline">View all →</button></div><div class="mini-list">${state.timeline.filter(x=>x.status!=='Complete').sort((a,b)=>(a.due||'').localeCompare(b.due||'')).slice(0,5).map(x=>`<div class="mini-row"><span class="dot"></span><div class="grow"><b>${esc(x.name)}</b><small>${niceDate(x.due)} · ${esc(x.assignee||'Unassigned')}</small></div><span class="pill">${esc(x.status)}</span></div>`).join('')||emptyMini('No open tasks')}</div></div><div class="card glass"><div class="card-head"><h3>Wedding readiness</h3><button class="tiny" data-explain>How it works</button></div><div class="ring" style="--score:${score}%"><strong>${score}%</strong></div><p style="text-align:center;color:var(--wk-muted)">Based on tasks, budget planning, RSVPs, vendors and travel.</p></div></div>
<div class="grid two" style="margin-top:18px"><div class="card glass"><div class="card-head"><h3>Budget at a glance</h3><button class="tiny" data-go="budget">Open budget →</button></div><div class="chart">${budgetBars()}</div></div><div class="card glass"><div class="card-head"><h3>Coming up</h3><button class="tiny" data-go="calendar">Calendar →</button></div><div class="mini-list">${upcoming().slice(0,5).map(x=>`<div class="mini-row"><div class="grow"><b>${esc(x.name)}</b><small>${niceDate(x.date||x.due)} · ${esc(x.type||x.category||'Wedding')}</small></div></div>`).join('')||emptyMini('Nothing scheduled yet')}</div></div></div></section>`}
function emptyMini(t){return `<div class="mini-row"><div class="grow"><b>${t}</b><small>Add an item whenever you are ready.</small></div></div>`}
function budgetBars(){let cats={};state.budget.forEach(x=>cats[x.category]=(cats[x.category]||0)+(+x.planned||0));let max=Math.max(...Object.values(cats),1);return Object.entries(cats).slice(0,7).map(([k,v])=>`<div class="bar" style="height:${Math.max(18,v/max*100)}%" title="${esc(k)}: ${money(v)}"><span>${esc(k.slice(0,7))}</span></div>`).join('')||'<p>No budget items yet.</p>'}
function upcoming(){return [...state.calendar,...state.timeline.filter(x=>x.status!=='Complete'),...state.events].filter(x=>x.date||x.due).sort((a,b)=>(a.date||a.due).localeCompare(b.date||b.due))}
function moduleView(k,cal=false){let d=defs[k],locked=DEMO&&d.premium,items=state[k]||[];return `<section class="view active"><div class="section-head"><div><span class="eyebrow">${d.section}</span><h2>${d.title}</h2><p>${d.desc}</p></div><div class="toolbar"><input class="search-field" data-filter placeholder="Filter ${d.title.toLowerCase()}…"><button class="btn primary" data-add="${k}" ${locked?'data-locked="1"':''}>＋ Add ${d.singular}</button></div></div>${cal?calendarView(items):`<div class="card glass table-wrap ${locked?'locked':''}">${table(k,items)}${locked?lockCover(d.title):''}</div>`}</section>`}
function table(k,items){let d=defs[k];if(!items.length)return `<div class="empty"><div class="bow">୨ৎ</div><h3>Your ${d.title.toLowerCase()} begin here</h3><p>Add the first detail when inspiration arrives.</p><button class="btn primary" data-add="${k}">Add ${d.singular}</button></div>`;let cols=d.fields.slice(0,4);return `<table><thead><tr>${cols.map(f=>`<th>${esc(f[1])}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${items.map(x=>`<tr data-row="${x.id}">${cols.map(f=>`<td>${cell(x[f[0]],f[2])}</td>`).join('')}<td><div class="actions"><button class="tiny" data-edit="${k}:${x.id}" aria-label="Edit">Edit</button><button class="tiny" data-delete="${k}:${x.id}" aria-label="Delete">×</button></div></td></tr>`).join('')}</tbody></table>`}
function cell(v,type){if(type==='date')return niceDate(v);if(type==='number'&&v!==''&&v!=null)return Number(v).toLocaleString();if(type==='color')return `<span class="pill"><i style="width:10px;height:10px;border-radius:50%;background:${esc(v)};margin-right:5px"></i>${esc(v)}</span>`;return `<span class="${['Complete','Paid','Booked','Attending','Selected','Ready','Sent','Packed'].includes(v)?'pill':''}">${esc(v||'—')}</span>`}
function lockCover(title){return `<div class="lock-cover"><div><div style="font-size:34px">୨ৎ</div><h3>Premium ${esc(title)}</h3><p>This demo keeps your preview beautiful and read-only.</p><button class="btn primary" data-upgrade>Unlock the full studio</button></div></div>`}
function calendarView(items){let now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,daysIn=new Date(y,m+1,0).getDate(),cells=[];for(let i=0;i<42;i++){let n=i-start+1,dt=new Date(y,m,n),key=dt.toISOString().slice(0,10),its=[...items,...state.events,...state.timeline].filter(x=>(x.date||x.due)===key);cells.push(`<div class="day ${n<1||n>daysIn?'muted':''} ${key===today()?'today':''}">${dt.getDate()}${its.slice(0,2).map(x=>`<i>${esc(x.name)}</i>`).join('')}</div>`)}return `<div class="card glass"><div class="card-head"><h3>${now.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h3><span class="pill">Tasks + events</span></div><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells.join('')}</div></div>`}

et,tId]=el.dataset.drag.split(':');if(k!==target)return;let i=state[k].findIndex(x=>x.id===id),j=state[k].findIndex(x=>x.id===tId);if(i<0||j<0)return;state[k].splice(j,0,state[k].splice(i,1)[0]);save();render()}});$$('[data-assign]').forEach(s=>s.onchange=()=>{let g=state.guests.find(g=>g.id===s.dataset.assign);let table=state.seating.find(t=>t.id===s.value);if(table&&state.guests.filter(g=>g.tableId===table.id).length>=+table.capacity){toast('Table capacity reached');s.value=g.tableId||'';return}g.tableId=s.value;save();render()});$$('[data-payment]').forEach(b=>b.onclick=()=>paymentDialog(b.dataset.payment));$('#simGuests')?.addEventListener('input',simulate);$('#simTier')?.addEventListener('change',simulate);$('#simRate')?.addEventListener('input',simulate);$$('[data-invite]').forEach(b=>b.onclick=()=>invitationEditor(b.dataset.invite));$('#startWizard')?.addEventListener('click',()=>wizard());$('#roadmap')?.addEventListener('click',roadmap);$('#taskView')?.addEventListener('change',e=>{taskMode=e.target.value;render()});$$('[data-report]').forEach(b=>b.onclick=()=>report(b.dataset.report));$('#weightSave')?.addEventListener('click',()=>{for(let k of ['cost','capacity','rating'])state.weights[k]=Math.max(0,Number($('#weight-'+k).value)||0);save();render()});$$('[data-allocation]').forEach(i=>i.onchange=()=>{state.allocations[i.dataset.allocation]=Math.max(0,+i.value||0);save()});$('#guestSort')?.addEventListener('change',e=>{state.guests.sort((a,b)=>String(a[e.target.value]||'').localeCompare(String(b[e.target.value]||'')));save();render()});$('#bulkStatus')?.addEventListener('change',e=>{let ids=$$('[data-select-guest]:checked').map(x=>x.value);state.guests.forEach(g=>{if(ids.includes(g.id))g.rsvp=e.target.value});save();render();toast(ids.length+' guests updated')});$('#calPrev')?.addEventListener('click',()=>{calOffset--;render()});$('#calNext')?.addEventListener('click',()=>{calOffset++;render()});hydrateMedia();};

function destinationCompare(){let max=Math.max(1,...state.destinations.map(x=>+x.cost||0)),w=state.weights;return `<div class="card glass"><h3>Weighted venue comparison</h3><p>Weights combine affordability, capacity and your rating. Scores compare your entered data only.</p><div class="toolbar">${['cost','capacity','rating'].map(k=>`<label>${k} weight <input id="weight-${k}" type="number" min="0" value="${w[k]}" style="width:65px"></label>`).join('')}<button class="btn" id="weightSave">Apply weights</button></div>${state.destinations.map(x=>{let score=((1-(+x.cost||0)/max)*w.cost+Math.min(1,(+x.capacity||0)/Math.max(1,+state.profile.expected||80))*w.capacity+Math.min(1,(+x.rating||0)/5)*w.rating)/Math.max(1,w.cost+w.capacity+w.rating);return `<div class="mini-row"><b>${esc(x.name)}</b><span>${money(x.cost)} · ${x.capacity||0} seats · ${Math.round(score*100)} points</span><span>${esc(x.advantages||'')} / ${esc(x.disadvantages||'')}</span></div>`}).join('')}</div>`}

function budgetTools(){let planned=state.budget.reduce((a,x)=>a+(+x.planned||0),0),paid=state.budget.reduce((a,x)=>a+(+x.actual||0),0);return `<div class="grid two" style="margin-top:20px"><div class="card glass"><h3>Financial overview</h3><p>Budget ${money(state.profile.budget)} · Estimated ${money(planned)} · Paid ${money(paid)} · Unpaid ${money(Math.max(0,planned-paid))}</p><p class="pill">${planned>state.profile.budget?'Over budget by '+money(planned-state.profile.budget):money(state.profile.budget-planned)+' remaining'}</p>${state.budget.map(x=>`<div class="mini-row"><span class="grow">${esc(x.name)}<small style="display:block">${niceDate(x.due)} · ${money(x.actual)} / ${money(x.planned)}</small></span><button class="btn" data-payment="${x.id}">Record payment</button></div>`).join('')}<div class="chart">${budgetBars()}</div><h4>Category allocations</h4>${CATEGORIES.split('|').map(c=>`<label class="switchline">${c}<input data-allocation="${c}" type="number" min="0" value="${state.allocations[c]||0}" style="width:100px"></label>`).join('')}<button class="btn" data-report="budget">Budget report</button></div><div class="card glass"><h3>Budget simulator</h3><p>Explore scenarios independently of your real budget. Rates are entered manually.</p><div class="field"><label for="simTier">Scenario</label><select id="simTier">${(DEMO?['Classic']:['Intimate','Classic','Luxury']).map(t=>`<option ${t==='Classic'?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="simGuests">Guest count</label><input id="simGuests" type="number" min="0" value="80"></div><div class="field"><label for="simRate">Manual exchange multiplier</label><input id="simRate" type="number" min="0.001" step="0.001" value="1"></div><p id="simResult"></p><h4>Payment history</h4>${state.payments.map(p=>`<div class="mini-row">${niceDate(p.date)} · ${money(p.amount)} · ${esc(state.budget.find(e=>e.id===p.expenseId)?.name||'Removed expense')}</div>`).join('')||'<p>No itemized payments recorded yet.</p>'}</div></div>`}
function simulate(){let count=Math.max(0,+$('#simGuests').value||0),tier=$('#simTier').value,rate=Math.max(.001,+$('#simRate').value||1),base={Intimate:9000,Classic:18000,Luxury:35000}[tier],per={Intimate:180,Classic:320,Luxury:650}[tier];$('#simResult').textContent='Scenario estimate: '+money((base+count*per)*rate)+' · No budget changes applied.'}

function taskCard(t){return `<div class="mini-row" draggable="true" data-drag="timeline:${t.id}"><div class="grow"><b>${esc(t.name)}</b><small>${niceDate(t.due)} · ${esc(t.priority||'Normal')} · ${t.due<today()&&t.status!=='Complete'?'OVERDUE':esc(t.status)}</small><p>${esc(t.checklist||'')}</p></div>${orderButtons('timeline',t)}</div>`}
function roadmap(){let tasks=[['Set your shared priorities',-400],['Choose your venue',-300],['Book your creative team',-220],['Send invitations',-150],['Confirm guest travel',-70],['Finalize your seating plan',-28],['Pack ceremony essentials',-7],['Celebrate your wedding',0],['Write thank-you notes',21]];for(let[name,offset]of tasks){if(state.timeline.some(t=>t.name===name))continue;if(!canCreate('timeline'))break;let dt=new Date(state.profile.date+'T12:00:00');dt.setDate(dt.getDate()+offset);state.timeline.push({id:uid(),name,due:dt.toISOString().slice(0,10),status:'To do',category:'Planning',assignee:'Both',suggestedOffset:offset})}save();render();toast('Suggested roadmap added')}

function itinerary(k){let arr=state[k].slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));let conflicts=[];if(k==='events')for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){let a=arr[i],b=arr[j],start=x=>(x.date||today())+'T'+(x.time||'00:00'),end=x=>(x.endDate||x.date||today())+'T'+(x.endTime||'23:59');if(start(a)<end(b)&&start(b)<end(a))conflicts.push(a.name+' overlaps '+b.name)}return `<div class="card glass" style="margin-top:20px"><h3>${k==='honeymoon'?'Day-by-day honeymoon itinerary':'Itinerary & schedule'}</h3>${conflicts.map(c=>`<p role="alert" class="pill">${esc(c)}</p>`).join('')}${arr.map(x=>`<div class="mini-row" draggable="true" data-drag="${k}:${x.id}"><div class="grow"><b>${esc(x.name)}</b><small>${niceDate(x.date)} ${esc(x.time||'')} – ${niceDate(x.endDate||x.departure||x.date)} ${esc(x.endTime||'')} · ${esc(x.venue||x.provider||x.location||'')}</small><p>${esc(x.notes||x.checklist||'')}</p>${k==='honeymoon'?'<p>Hotel: '+esc(x.hotel||'—')+' · Flight: '+esc(x.flight||'—')+' · '+money(x.cost)+'</p>':''}</div>${orderButtons(k,x)}</div>`).join('')}${k==='honeymoon'?'<p>Separate honeymoon total: '+money(arr.reduce((a,x)=>a+(+x.cost||0),0))+'</p>':''}<button class="btn" data-report="${k}">Print itinerary</button></div>`}

function packingTools(){let n=state.packing.filter(x=>x.status==='Packed').length;return `<div class="card glass"><h3>${n} of ${state.packing.length} items packed</h3><div class="progress"><i style="width:${state.packing.length?n/state.packing.length*100:0}%"></i></div><p>Use Filter above with “To pack” to show incomplete items. Preparation appointments are recorded in each item.</p><button class="btn" data-report="packing">Print checklist</button></div>`}

function invitationEditor(id){let x=state.invitations.find(x=>x.id===id);openModal(`<h2 id="modalTitle">Invitation designer</h2><div class="field"><label for="inviteWords">Wording</label><textarea id="inviteWords">${esc(x.message||'Together with our families, please join us')}</textarea></div><div class="field"><label for="inviteColor">Color</label><input id="inviteColor" type="color" value="${/^#[\da-f]{6}$/i.test(x.color)?x.color:'#c48c9d'}"></div><div class="field"><label for="inviteFont">Typography</label><select id="inviteFont"><option>Serif</option><option>Sans serif</option></select></div><div id="invitationPreview" class="invitation"></div><div class="modal-actions"><button class="btn" id="inviteCopy">Copy message</button><a class="btn" id="inviteShare" target="_blank" rel="noopener">WhatsApp</a><button class="btn" id="invitePrint">Print PDF</button><button class="btn primary" id="inviteSave">Save design</button><button class="btn" data-close>Close</button></div>`);let preview=()=>{let text=$('#inviteWords').value,color=$('#inviteColor').value,font=$('#inviteFont').value;$('#invitationPreview').style.setProperty('--invitation-accent',color);$('#invitationPreview').style.borderColor=color;$('#invitationPreview').style.color='var(--wk-text)';$('#invitationPreview').style.fontFamily=font==='Serif'?'Georgia,serif':'Arial,sans-serif';$('#invitationPreview').innerHTML=`<div><svg width="36" height="25" viewBox="0 0 72 50" aria-hidden="true" focusable="false"><path fill="currentColor" d="M33 22C10-1 0 10 10 23c5 7 13 8 23 4L24 47l11-6 5 7-1-21c20 11 32-6 22-17-7-8-18 3-24 12z"/><ellipse cx="36" cy="24" rx="5" ry="7" fill="currentColor"/></svg></div><h2>${esc(state.profile.couple)}</h2><p>${esc(text).replace(/\n/g,'<br>')}</p><p>${niceDate(state.profile.date)}</p><p>${esc(state.profile.destination)}</p><small>${esc(x.dressCode||'')}</small>`;$('#inviteShare').href='https://wa.me/?text='+encodeURIComponent(state.profile.couple+'\n'+text+'\n'+niceDate(state.profile.date)+' · '+state.profile.destination)};for(let el of ['inviteWords','inviteColor','inviteFont'])$('#'+el).oninput=preview;$('#inviteFont').value=x.font||'Serif';$('#inviteCopy').onclick=()=>navigator.clipboard.writeText($('#invitationPreview').innerText).then(()=>toast('Copied')).catch(()=>toast('Select the preview text to copy.'));$('#inviteSave').onclick=()=>{x.message=$('#inviteWords').value;x.color=$('#inviteColor').value;x.font=$('#inviteFont').value;save();toast('Design saved')};$('#invitePrint').onclick=()=>{if(DEMO)return upgrade();printHTML('Invitation',$('#invitationPreview').outerHTML)};preview()}
function printHTML(title,html){let frame=document.createElement('iframe');frame.style.cssText='position:fixed;width:1px;height:1px;opacity:0';document.body.append(frame);let doc=frame.contentDocument;doc.open();doc.write('<!doctype html><html><head><title>'+esc(title)+'</title><style>body{font:14px Georgia;color:#342932;padding:30px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border:1px solid #ddd;text-align:left}.actions,button{display:none}.invitation{text-align:center;padding:40px;border:1px solid #c6a57d;white-space:pre-line}</style></head><body><h1>'+esc(state.profile.couple)+' — '+esc(title)+'</h1><p>'+niceDate(state.profile.date)+'</p>'+html+'</body></html>');doc.close();frame.contentWindow.focus();frame.contentWindow.print();setTimeout(()=>frame.remove(),60000)}

const oldExport=exportData;
exportData=async function(type,locked){if(DEMO)return upgrade();if(type!=='json')return oldExport(type,false);try{let media=await mediaOp('readonly',s=>s.getAll()),packed=[];for(let m of media){let data=await new Promise((resolve,reject)=>{let r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(m.blob)});packed.push({id:m.id,name:m.name,type:m.type,data})}download('wellkept-backup.json',JSON.stringify({...state,media:packed},null,2),'application/json');toast('Complete backup exported')}catch(e){toast('Backup failed: '+e.message)}};

wwCSV=function(key){if(DEMO)return wwLimit();let fields=wwSchemas()[key]||[],csv=[fields.map(f=>'"'+wt(f[1]).replace(/"/g,'""')+'"').join(',')];for(let r of state[key])csv.push(fields.map(([name,,type])=>{let v=r[name];if(type==='money'||type==='optionalMoney')v=v==null?'':(v/100).toFixed(2);else if(type==='multi')v=(v||[]).map(id=>wl(state.program.find(e=>e.id===id)||{})).join('; ');else if(type==='check')v=wt(v?'yes':'no');else if(name==='rsvp')v=wt(v);return '"'+String(v??'').replace(/"/g,'""')+'"'}).join(','));download('WellKept-'+key+'.csv','\uFEFF'+csv.join('\r\n'),'text/csv;charset=utf-8')};

function wwNumberReels(){if(WW_CAPTURE||state.prefs.calm||state.prefs.reduced||matchMedia('(prefers-reduced-motion:reduce)').matches)return;$$('#content .stat strong,#content .countdown strong,#content .ring strong').forEach(el=>{let value=el.textContent,source=document.createElement('span');source.className='ww-number-source';source.textContent=value;el.replaceChildren(source);let visual=document.createElement('span');visual.setAttribute('aria-hidden','true');for(let char of value){if(!/\d/.test(char)){visual.append(document.createTextNode(char));continue}let slot=document.createElement('span'),strip=document.createElement('span');slot.className='ww-digit-slot';strip.className='ww-digit-strip';let digit=Number(char),steps=10+digit;for(let i=0;i<=steps;i++){let row=document.createElement('span');row.textContent=i%10;strip.append(row)}strip.style.transform='translateY(-'+steps*1.1+'em)';slot.append(strip);visual.append(slot);strip.animate([{transform:'translateY(0)'},{transform:strip.style.transform}],{duration:800,easing:'cubic-bezier(.16,1,.3,1)'})}el.append(visual)});$$('.ww-keys .filled').forEach((el,i)=>el.style.animationDelay=(i*.05)+'s');$$('.ring').forEach(el=>el.animate([{opacity:0,transform:'rotate(-20deg) scale(.9)'},{opacity:1,transform:'rotate(0) scale(1)'}],{duration:650,easing:'ease-out'}))}

{let[k,...v]=wwDeleteRows.split('|');['en','fr','es','de'].forEach((l,i)=>WW_DICT[l][k]=v[i])}

function wwBloomPalette(){if(!state.prefs.paletteVersion){state.prefs.palette='bloom';state.prefs.paletteVersion=1;wwSave()}}
let wwBloomObserver;
function wwBloomMotion(){return !WW_CAPTURE&&!state.prefs.calm&&!state.prefs.reduced&&!matchMedia('(prefers-reduced-motion:reduce)').matches}
const wwBeforeBloomRender=wwRender;
wwRender=function(){wwBloomPalette();wwBloomObserver?.disconnect();wwBeforeBloomRender();if(!wwBloomMotion())return;let index=0;wwBloomObserver=new IntersectionObserver(entries=>{for(let entry of entries)if(entry.isIntersecting){let el=entry.target;el.animate([{opacity:0,transform:'translateY(18px) scale(.99)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:650,delay:Math.min(index++%5,4)*50,easing:'cubic-bezier(.16,1,.3,1)'});wwBloomObserver.unobserve(el)}},{threshold:.06});$$('#content .card,#content .ww-hero').forEach(el=>wwBloomObserver.observe(el))};
