.ww-mode[data-palette=bloom] body{background-image:radial-gradient(ellipse at 86% 5%,#cdedfe99,transparent 47%),radial-gradient(ellipse at 5% 65%,#f0bfdd66,transparent 48%),linear-gradient(145deg,var(--bg),var(--surface2))}
.ww-mode[data-theme=dark][data-palette=bloom] body{background-image:radial-gradient(ellipse at 86% 5%,#33536655,transparent 47%),radial-gradient(ellipse at 5% 65%,#a8297c22,transparent 48%),linear-gradient(145deg,var(--bg),var(--surface2))}
.ww-mode[data-palette=bloom] .app .ww-hero{background:linear-gradient(115deg,var(--surface) 12%,color-mix(in srgb,var(--wk-pink) 40%,var(--surface)) 52%,color-mix(in srgb,var(--palette-blue) 65%,var(--surface)) 100%);isolation:isolate;overflow:hidden}
.ww-mode[data-theme=dark][data-palette=bloom] .app .ww-hero{background:linear-gradient(115deg,var(--surface),#47273f 58%,#253e4c)}

.ww-mode[data-palette=bloom] .app .hero:before{inset:0 0 auto;width:100%;height:4px;border:0;border-radius:0;opacity:1;background:linear-gradient(90deg,var(--palette-fuchsia) 0 36%,var(--palette-green) 36% 57%,var(--palette-blue) 57% 79%,var(--palette-orange) 79%)}
.ww-mode[data-palette=bloom] .app .hero:after{content:'';display:block;position:absolute;z-index:-1;inset:auto 6% -130px auto;width:320px;height:320px;border-radius:50%;opacity:.32;background:radial-gradient(circle at 34% 30%,var(--palette-green),transparent 50%),radial-gradient(circle at 70% 65%,var(--palette-orange),transparent 60%);animation:ww-bloom-orbit 18s ease-in-out infinite alternate;pointer-events:none}
.ww-mode[data-palette=bloom] .app .stats>.stat{border-top:3px solid var(--palette-fuchsia)}
.ww-mode[data-palette=bloom] .app .stats>.stat:nth-child(4n+2){border-top-color:var(--palette-green)}
.ww-mode[data-palette=bloom] .app .stats>.stat:nth-child(4n+3){border-top-color:var(--palette-orange)}
.ww-mode[data-palette=bloom] .app .stats>.stat:nth-child(4n+4){border-top-color:var(--palette-blue)}
.ww-mode[data-palette=bloom] .app .progress i{background:linear-gradient(90deg,var(--palette-fuchsia),var(--palette-orange));transform-origin:left;animation:ww-bloom-fill .8s cubic-bezier(.2,.8,.2,1) backwards}

.ww-mode[data-palette=bloom] .garden-flower{color:var(--palette-green);opacity:.2}
.ww-mode[data-palette=bloom] .garden-sparkle{color:var(--palette-orange);opacity:.32}
.ww-mode[data-palette=bloom] .garden-flower svg{animation:ww-bloom-turn 24s linear infinite}
.ww-mode[data-palette=bloom] .garden-sparkle svg{animation:ww-bloom-twinkle 4.8s ease-in-out var(--gdelay) infinite}
.ww-mode[data-theme=dark][data-palette=bloom] .garden-heart{color:#f39bd1;opacity:.2}

.ww-mode[data-theme=dark][data-palette=bloom] .garden-sparkle{color:#efaa82}
.ww-mode[data-palette=bloom] .aurora{inset:4% auto auto 18%;width:42vw;height:42vw;min-width:360px;min-height:360px;background:radial-gradient(circle,#a8297c1c,transparent 66%);opacity:.8;z-index:0;animation:ww-bloom-orbit 25s ease-in-out infinite alternate}
.ww-mode[data-palette=bloom] .aurora:before{background:radial-gradient(circle,#3f8c3122,transparent 65%);animation:ww-bloom-orbit 31s ease-in-out infinite alternate-reverse}
.ww-mode[data-palette=bloom] .aurora:after{background:radial-gradient(circle,#d4662b22,transparent 66%);animation:ww-bloom-orbit 29s ease-in-out infinite alternate}
.ww-mode .app .btn,.ww-mode .app .icon-btn,.ww-mode .app .ww-amount{position:relative;isolation:isolate;overflow:hidden;transition:transform .22s ease,opacity .22s ease}
.ww-mode .app .btn:active,.ww-mode .app .icon-btn:active,.ww-mode .app .ww-amount:active{transform:scale(.97)}
.ww-mode .app .btn.primary:after{content:'';position:absolute;inset:-100% auto -100% -80%;width:45%;background:linear-gradient(90deg,transparent,#ffffff35,transparent);transform:translateX(0) rotate(20deg);animation:ww-bloom-sheen 7.5s ease-in-out infinite;pointer-events:none;z-index:-1}

.ww-mode .app .card{transition:transform .25s ease}
.ww-mode .app :is(.stat,.countdown,.ring) strong span{font-size:inherit;font-family:inherit;font-weight:inherit;color:inherit}
.ww-mode .app .main{transition:none}.ww-mode .app .sidebar{transition:transform .3s var(--ease)}
@media(hover:hover) and (pointer:fine){.ww-mode:not(.reduce-motion):not(.ww-capture) .app .btn:hover,.ww-mode:not(.reduce-motion):not(.ww-capture) .app .icon-btn:hover{transform:translateY(-2px)}.ww-mode:not(.reduce-motion):not(.ww-capture) .app .ww-records>.card:hover{transform:translateY(-4px)}.ww-mode .nav-item:hover .ww-icon{transform:rotate(-7deg)}.ww-mode .nav-item .ww-icon{transition:transform .2s ease}}
@keyframes ww-bloom-float{0%{transform:translate3d(-12px,28px,0) rotate(-12deg)}50%{transform:translate3d(15px,-14px,0) rotate(5deg)}100%{transform:translate3d(-6px,-50px,0) rotate(18deg)}}
@keyframes ww-bloom-turn{to{transform:rotate(360deg)}}
@keyframes ww-bloom-twinkle{0%,100%{opacity:.35;transform:scale(.78)}50%{opacity:1;transform:scale(1.12)}}
@keyframes ww-bloom-orbit{to{transform:translate3d(42px,-24px,0) rotate(12deg) scale(1.08)}}
@keyframes ww-bloom-breathe{0%,100%{opacity:.12;transform:scale(.99)}50%{opacity:.35;transform:scale(1.025)}}
@keyframes ww-bloom-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ww-bloom-sheen{0%,72%{transform:translateX(0) rotate(20deg);opacity:0}76%{opacity:1}91%,100%{transform:translateX(650%) rotate(20deg);opacity:0}}
@keyframes ww-bloom-ripple{from{opacity:.16;transform:scale(0)}to{opacity:0;transform:scale(2)}}

function wwField(f,value){let[name,label,type,required,options]=f,id='ww-'+name,v=value??'',control='',attrs=`id="${id}" name="${name}" ${required?'required':''}`;if(type==='multi')control=`<div class="ww-checks">${options.map(([key,text])=>`<label><input type="checkbox" name="${name}" value="${esc(key)}" ${(Array.isArray(v)?v:[]).includes(key)?'checked':''}> ${esc(WW_DICT.en[text]?wt(text):text)}</label>`).join('')}</div>`;else if(type==='select')control=`<select ${attrs}>${wwSelectOptions(options,v)}</select>`;else if(type==='check')control=`<input type="checkbox" ${attrs} ${v?'checked':''}>`;else if(type==='textarea')control=`<textarea ${attrs} maxlength="4000">${esc(v)}</textarea>`;else{let it=['money','optionalMoney','text'].includes(type)?'text':['int','signed','number'].includes(type)?'number':type;if(type==='money'||type==='optionalMoney')v=v===''||v===null?'':(v/100).toFixed(2);let limits=type==='int'?'min="0" step="1"':type==='number'?'min="0" step="any"':type==='signed'?'min="-2000" max="2000" step="1"':'';control=`<input type="${it}" ${attrs} value="${esc(v)}" ${limits} ${type.includes('Money')||type==='money'?'inputmode="decimal"':''} maxlength="500">`}return `<div class="field ${['textarea','multi','check'].includes(type)?'full':''}"><label ${type==='multi'?'':`for="${id}"`}>${wt(label)}${required?' *':''}</label>${control}</div>`}

function wwConfirm(title,fn){openModal(`<div class="modal-head"><h2 id="modalTitle">${wt('confirm')}</h2><button class="icon-btn" data-close aria-label="${wt('close')}">${wi('close')}</button></div><p>${esc(title)}</p><div class="modal-actions">${wwButton('cancel','data-close')}${wwButton('confirm','id="wwConfirm"',true)}</div>`);$('#wwConfirm').onclick=()=>{closeModal();fn()}}
function wwDefault(k){let home=state.wedding.currency;return {id:wwId(),name:'',adults:1,children:0,rsvp:'pending',events:[],currency:home,quantity:1,estimate:0,quote:0,actual:0,amount:0,homeAmount:null,rate:1,rateDate:wwToday(),needsShuttle:true,rooms:1,nights:3,paidBy:'guest',offset:-30,due:'',type:'deposit',status:'idea',price:0,pledged:0,received:0,roomsHeld:10,ratePerNight:0,lockedAmount:0,weight:0}}
function wwEdit(k,id,defaults={}){if(!Object.hasOwn(wwSchemas(),k))return;if(!id&&DEMO&&WW_LIMITS[k]!=null&&state[k].length>=WW_LIMITS[k])return wwLimit();let item=id?(k==='currencies'?state.currencies.find(c=>c.code===id):state[k].find(r=>r.id===id)):null;if(id&&!item)return;item={...wwDefault(k),...item,...defaults};let fields=wwSchemas()[k];if(!fields)return;let html=fields.map(f=>wwField(f,item[f[0]])).join('');openModal(`<div class="modal-head"><h2 id="modalTitle">${wt(id?'edit':'add')} · ${wt(wwEntityLabel(k))}</h2><button class="icon-btn" data-close aria-label="${wt('close')}">${wi('close')}</button></div><form id="wwForm"><div class="form-grid">${html}</div><p id="wwFormError" role="alert"></p><div class="modal-actions">${wwButton('cancel','type="button" data-close')}${wwButton('save','type="submit"',true)}</div></form>`);wwDictation($('#wwForm'));$('#wwForm').onsubmit=e=>{e.preventDefault();let form=e.target;if(!form.reportValidity())return;let fd=new FormData(form),out={...item};try{for(let [name,,type]of fields){let v=fd.get(name);out[name]=type==='multi'?fd.getAll(name):type==='check'?fd.has(name):type==='money'?wwDecimal(v):type==='optionalMoney'?(v===''?null:wwDecimal(v)):['int','signed','number'].includes(type)?Number(v||0):String(v||'').trim()}if(out.name!==item.name)delete out.labelKey;if(k==='currencies'){if(out.rate<=0||state.currencies.some(c=>c.code===out.code&&c.code!==id))throw Error('invalid');if(id&&out.code!==id&&(state.items.some(i=>i.currency===id)||state.payments.some(p=>p.currency===id)))throw Error('invalid')}if(k==='parties'&&out.adults+out.children<1)throw Error('invalid');if(k==='stays'&&(out.nights<1||out.rooms<1))throw Error('invalid');if(k==='travels'&&out.depart&&out.arrive&&out.depart<out.arrive)throw Error('invalid');if(k==='items'&&out.isShuttle&&out.perGuestEventId)throw Error('invalid');if(k==='quotes'&&!out.currency)out.currency=state.wedding.currency;let ok=wwChange('actionSave',()=>{let ix=k==='currencies'?state[k].findIndex(x=>x.code===id):state[k].findIndex(x=>x.id===id);if(ix>=0)state[k][ix]=out;else{if(DEMO&&WW_LIMITS[k]!=null&&state[k].length>=WW_LIMITS[k])throw Error('limit');state[k].push(out)}},out.name||out.vendor||wt(wwEntityLabel(k)));if(ok){closeModal();toast(wt('saved'))}}catch{form.querySelector('#wwFormError').textContent=wt('invalid')}}}
function wwDelete(k,id){if(!Object.hasOwn(wwSchemas(),k))return;wwConfirm(wt('confirmDelete'),()=>wwChange('actionDelete',()=>{let found=k==='currencies'?state[k].find(x=>x.code===id):state[k].find(x=>x.id===id);if(!found)return;if(k==='currencies'&&[...state.items,...state.payments,...state.hotels].some(x=>x.currency===id))throw Error('invalid');if(k==='program'){state.items.filter(i=>i.perGuestEventId===id).forEach(i=>{let amount=wwItemAmount(i);i.estimate=amount;i.quote=amount;i.actual=0;i.perGuestEventId='';i.quantity=1});state.parties.forEach(p=>p.events=p.events.filter(x=>x!==id))}state[k]=state[k].filter(x=>k==='currencies'?x.code!==id:x.id!==id);if(k==='parties'){state.travels=state.travels.filter(x=>x.partyId!==id);state.stays=state.stays.filter(x=>x.partyId!==id)}if(k==='hotels')state.stays=state.stays.filter(x=>x.hotelId!==id);if(k==='vendors')state.items.forEach(i=>{if(i.vendorId===id)i.vendorId=''});if(k==='categories')state.items.forEach(i=>{if(i.catId===id)i.catId=''});},wt(wwEntityLabel(k))))}
function wwActions(k,r){let id=k==='currencies'?r.code:r.id;return `<div class="ww-actions"><button class="btn" data-ww-edit="${k}:${esc(id)}">${wt('edit')}</button><button class="btn" data-ww-delete="${k}:${esc(id)}">${wt('delete')}</button></div>`}

const WW_SECTION_ART = {budget:'budget',payments:'payments',vendors:'vendors',guests:'rsvp',program:'program',checklist:'checklist'};
function wwArt(name) {
  return name ? `<img class="ww-illustration" data-ww-art="${name}" src="${WW_ART[name]}" width="512" height="512" alt="" decoding="async" draggable="false">` : '';
}
function wwSection(key,actions=''){return `<section class="view active ww"><div class="section-head"><div class="ww-section-heading">${wwArt(key==='stay'?(wwTab==='transfers'?'shuttle':'hotel'):WW_SECTION_ART[key])}<div><span class="eyebrow">WA-004 · ${wt('planning')}</span><h2>${wt(key)}</h2></div></div><div class="toolbar">${actions}</div></div>`}
function wwCard(title,content,cls=''){return `<article class="card glass ${cls}"><h3>${title}</h3>${content}</article>`}
function wwStat(title,value,note=''){return `<div class="stat glass"><span>${title}</span><strong class="money">${value}</strong>${note?`<small>${note}</small>`:''}</div>`}
function wwEmpty(key){return `<div class="empty"><span aria-hidden="true">${wi('shell')}</span><p>${wt('empty')}</p>${key?wwButton('add',`data-ww-add="${key}"`,true):''}</div>`}

const wwOriginalSample=wwSample;

function wwAllocations(d=state){let out=new Map(),locked=d.categories.filter(c=>c.locked===true||(c.locked===undefined&&c.lockedAmount>0)),free=d.categories.filter(c=>!locked.includes(c));locked.forEach(c=>out.set(c.id,c.lockedAmount||0));let avail=Math.max(0,d.wedding.totalBudget-locked.reduce((a,c)=>a+(c.lockedAmount||0),0)),weight=free.reduce((a,c)=>a+Math.max(0,c.weight||0),0),raw=free.map(c=>avail*(weight?Math.max(0,c.weight||0)/weight:1/Math.max(1,free.length))),values=raw.map(Math.floor),remain=avail-values.reduce((a,v)=>a+v,0);raw.map((v,i)=>[v-values[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(remain>0){values[i]++;remain--}});free.forEach((c,i)=>out.set(c.id,values[i]));return out}
const wwOriginalBudget=wwBudget;

const wwOriginalValidate=wwValidate;
wwValidate=function(d){wwOriginalValidate(d);let validDate=v=>!v||/^\d{4}-\d{2}-\d{2}$/.test(v)&&new Date(v+'T12:00:00Z').toISOString().slice(0,10)===v,validTime=v=>!v||/^([01]\d|2[0-3]):[0-5]\d$/.test(v),validDT=v=>!v||typeof v==='string'&&validDate(v.slice(0,10))&&v[10]==='T'&&validTime(v.slice(11,16)),money=v=>Number.isSafeInteger(v)&&v>=0&&v<=1e13,integer=v=>Number.isInteger(v)&&v>=0;for(let c of d.currencies)if(c.rate<.000001||c.rate>1e6)throw Error('invalidImport');for(let p of d.parties)if(p.adults+p.children<1||p.events.some(id=>!d.program.some(e=>e.id===id)))throw Error('invalidImport');for(let it of d.items)if(!Number.isSafeInteger(wwItemAmount(it,d)))throw Error('invalidImport');for(let p of d.payments)if(!validDate(p.due)||!validDate(p.paidDate)||p.homeAmount!=null&&!money(p.homeAmount))throw Error('invalidImport');for(let h of d.hotels)if(!integer(h.roomsHeld)||!money(h.ratePerNight)||!validDate(h.releaseDate)||![d.wedding.currency,...d.currencies.map(c=>c.code)].includes(h.currency))throw Error('invalidImport');for(let e of d.program)if(!validDate(e.date)||!validTime(e.time))throw Error('invalidImport');for(let x of d.deadlines)if(!validDate(x.due)||x.offset!=null&&!Number.isInteger(x.offset))throw Error('invalidImport');for(let x of d.travels)if(!d.parties.some(p=>p.id===x.partyId)||!validDT(x.arrive)||!validDT(x.depart))throw Error('invalidImport');for(let x of d.stays)if(!d.parties.some(p=>p.id===x.partyId)||!d.hotels.some(h=>h.id===x.hotelId)||!integer(x.rooms)||x.rooms<1||!integer(x.nights)||x.nights<1)throw Error('invalidImport');if(new Set(d.travels.map(x=>x.partyId)).size!==d.travels.length||new Set(d.stays.map(x=>x.partyId)).size!==d.stays.length)throw Error('invalidImport');for(let q of d.quotes)if(!money(q.price))throw Error('invalidImport');return d};

function wwPaymentCalendar(){let [y,m]=wwPayMonth.split('-').map(Number),date=new Date(Date.UTC(y,m-1,1)),offset=(date.getUTCDay()+6)%7,heading=new Intl.DateTimeFormat(wwLocale(),{month:'long',year:'numeric',timeZone:'UTC'}).format(date),days=[];for(let i=0;i<42;i++){let day=wwAdd(wwPayMonth+'-01',i-offset),payments=state.payments.filter(p=>p.due===day);days.push(`<div class="ww-calendar-day ${day.slice(0,7)!==wwPayMonth?'outside':''}"><span>${wn(Number(day.slice(-2)))}</span>${payments.map(p=>`<button class="btn" data-ww-edit="payments:${p.id}" aria-label="${wt('payments')} · ${wd(p.due)} · ${esc(wl(state.items.find(i=>i.id===p.itemId)||{})||wt('removedItem'))}">${wm(p.amount,p.currency)}</button>`).join('')}</div>`)}return `<div class="card glass ww-payment-calendar ww-space"><div class="ww-calendar-head"><button class="btn" data-ww-month="-1" aria-label="${wt('back')}">${wi('chevron')}</button><h3>${wt('paymentCalendar')} · ${heading}</h3><button class="btn" data-ww-month="1" aria-label="${wt('nextStep')}"><span style="transform:rotate(180deg);display:inline-flex">${wi('chevron')}</span></button></div><div class="ww-calendar-grid">${Array.from({length:7},(_,i)=>'<div class="cal-head">'+new Intl.DateTimeFormat(wwLocale(),{weekday:'short',timeZone:'UTC'}).format(new Date(Date.UTC(2027,0,4+i)))+'</div>').join('')}${days.join('')}</div><div class="ww-pay-agenda">${state.payments.filter(p=>p.due?.slice(0,7)===wwPayMonth).map(p=>`<button class="btn" data-ww-edit="payments:${p.id}">${wd(p.due)} · ${wm(p.amount,p.currency)}</button>`).join('')||'<p>'+wt('empty')+'</p>'}</div></div>`}
const wwBasePayments=wwPayments;
wwPayments=function(){return wwBasePayments().replace('<div class="ww-records">',wwPaymentCalendar()+'<div class="ww-records ww-space">')};

function wwCelebrate(before){if(WW_CAPTURE||state.prefs.calm||state.prefs.reduced||matchMedia('(prefers-reduced-motion:reduce)').matches)return;let yes=d=>d.parties.length>0&&d.parties.every(p=>p.rsvp==='yes'),paid=d=>{let m=wwMetrics(d);return m.forecast>0&&m.paid>=m.forecast};if(yes(state)&&!yes(before)||paid(state)&&!paid(before)){let el=document.createElement('div');el.className='ww-celebration';el.setAttribute('aria-hidden','true');el.innerHTML=Array.from({length:7},(_,i)=>'<i style="--i:'+i+'"></i>').join('');document.body.append(el);setTimeout(()=>el.remove(),1400)}}

const wwSafeMigrate=wwMigrate;
wwMigrate=function(raw){let d=wwSafeMigrate(raw);d.vendors.forEach(v=>{if(['Booked','Quoted','Paid','Researching'].includes(v.status))v.status={Booked:'booked',Quoted:'quoted',Paid:'paid',Researching:'idea'}[v.status]});d.parties.forEach(p=>p.events=p.events.filter(id=>d.program.some(e=>e.id===id)));return d};
wwVideo=function(){let stages=[['dashboard',0],['dashboard',1600],['budget',3300],['program',5700],['stay',7900]];window.WellKept.videoStages=[];for(let[view,delay]of stages)setTimeout(()=>{wwNavigate(view);window.WellKept.videoStages.push(view);if(delay===1600)$('.ww-arrival')?.closest('.card')?.scrollIntoView({behavior:'smooth',block:'center'});if(view==='budget')$('[data-ww-flip]')?.click();if(view==='stay'){wwTab='hotels';wwRender()}},delay)};

new MutationObserver(wwDrawerA11y).observe($('#sidebar'),{attributes:true,attributeFilter:['class']});matchMedia('(max-width:760px)').addEventListener('change',wwDrawerA11y);wwDrawerA11y();
window.WellKept.migrate=wwMigrate;window.WellKept.defaultRecord=wwDefault;window.WellKept.allocations=wwAllocations;
/* Transform-only number reels retain one accessible, exact final value. */
function wwNumberReels(){if(WW_CAPTURE||state.prefs.calm||state.prefs.reduced||matchMedia('(prefers-reduced-motion:reduce)').matches)return;$$('#content .stat strong,#content .countdown strong,#content .ring strong').forEach(el=>{let value=el.textContent,source=document.createElement('span');source.className='ww-number-source';source.textContent=value;el.replaceChildren(source);let visual=document.createElement('span');visual.setAttribute('aria-hidden','true');for(let char of value){if(!/\d/.test(char)){visual.append(document.createTextNode(char));continue}let slot=document.createElement('span'),strip=document.createElement('span');slot.className='ww-digit-slot';strip.className='ww-digit-strip';let digit=Number(char),steps=10+digit;for(let i=0;i<=steps;i++){let row=document.createElement('span');row.textContent=i%10;strip.append(row)}strip.style.transform='translateY(-'+steps*1.1+'em)';slot.append(strip);visual.append(slot);strip.animate([{transform:'translateY(0)'},{transform:strip.style.transform}],{duration:800,easing:'cubic-bezier(.16,1,.3,1)'})}el.append(visual)});$$('.ww-keys .filled').forEach((el,i)=>el.style.animationDelay=(i*.05)+'s');$$('.ring').forEach(el=>el.animate([{opacity:0,transform:'rotate(-20deg) scale(.9)'},{opacity:1,transform:'rotate(0) scale(1)'}],{duration:650,easing:'ease-out'}))}
const wwRendered=wwRender;wwRender=function(){wwRendered();wwNumberReels()};window.WellKept.render=wwRender;
const wwOldHelp=wwHelp;wwHelp=function(){wwOldHelp();let box=$('#modalLayer .modal'),actions=box.querySelector('.modal-actions'),guide=document.createElement('div');guide.innerHTML=['budget','guests','stay','program','checklist'].map((key,i)=>'<h3>'+wt(key)+'</h3><p>'+wt('tour'+(i+1))+'</p>').join('');box.insertBefore(guide,actions)};

   a single Undo restores the complete group. */

{let[k,...v]=wwDeleteRows.split('|');['en','fr','es','de'].forEach((l,i)=>WW_DICT[l][k]=v[i])}
wwDelete=function(k,id){if(k!=='items')return wwOldDelete(k,id);wwConfirm(wt('deleteExpense'),()=>wwChange('actionDelete',()=>{state.items=state.items.filter(x=>x.id!==id);state.payments=state.payments.filter(x=>x.itemId!==id);state.quotes=state.quotes.filter(x=>x.itemId!==id)},wt('item')))};

/* Fuchsia Garden: apply the requested palette once, retaining future choices. */
{let names=['Fuchsia Garden','Jardin fuchsia','Jardín fucsia','Fuchsiengarten'];['en','fr','es','de'].forEach((l,i)=>WW_DICT[l].bloom=names[i])}
function wwBloomPalette(){if(!state.prefs.paletteVersion){state.prefs.palette='bloom';state.prefs.paletteVersion=1;if(!wwBooting)wwSave()}}
let wwBloomObserver;
function wwBloomMotion(){return !WW_CAPTURE&&!state.prefs.calm&&!state.prefs.reduced&&!matchMedia('(prefers-reduced-motion:reduce)').matches}
const wwBeforeBloomRender=wwRender;
wwRender=function(){wwBloomPalette();wwBloomObserver?.disconnect();wwBeforeBloomRender();if(!wwBloomMotion())return;let index=0;wwBloomObserver=new IntersectionObserver(entries=>{for(let entry of entries)if(entry.isIntersecting){let el=entry.target;el.animate([{opacity:0,transform:'translateY(18px) scale(.99)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:650,delay:Math.min(index++%5,4)*50,easing:'cubic-bezier(.16,1,.3,1)'});wwBloomObserver.unobserve(el)}},{threshold:.06});$$('#content .card,#content .ww-hero').forEach(el=>wwBloomObserver.observe(el))};
window.WellKept.render=wwRender;
document.addEventListener('pointerdown',event=>{let button=event.target.closest('button.btn,button.icon-btn,button.ww-amount');if(!button||button.disabled||!wwBloomMotion())return;let rect=button.getBoundingClientRect(),ripple=document.createElement('span');ripple.className='ww-ripple';ripple.setAttribute('aria-hidden','true');ripple.style.setProperty('--rx',(event.clientX-rect.left)+'px');ripple.style.setProperty('--ry',(event.clientY-rect.top)+'px');ripple.style.setProperty('--rs',Math.max(rect.width,rect.height)+'px');button.append(ripple);setTimeout(()=>ripple.remove(),600)});
const WW_LOAD_WARNING = {
  en:'Saved planner data could not be loaded. Sample data is shown for this session.',
  fr:'Impossible de charger les données enregistrées. Les données exemple sont affichées.',
  es:'No se pudieron cargar los datos guardados. Se muestran datos de ejemplo.',
  de:'Gespeicherte Daten konnten nicht geladen werden. Beispieldaten werden angezeigt.'
};
let savedDataInvalid=false;
state=wwSample();
if(!wwTemporary){
  try{
    const saved=localStorage.getItem(KEY);
    if(saved){
      const previous=JSON.parse(saved);
      state=wwValidate(wwMigrate(previous));
      // Keep older preview data in storage without exposing it to the current planner.
      wwStoredExtras=previous.schema===WW_SCHEMA
        ?Object.fromEntries(Object.entries(previous).filter(([key])=>!Object.hasOwn(state,key)))
        :{legacyPreview:previous};
    }
  }catch{savedDataInvalid=true}
}
wwPersisted=wwClone(state);
wwPayMonth=wwToday().slice(0,7);
wwRender();
wwBooting=false;
if(savedDataInvalid)toast(WW_LOAD_WARNING[state.prefs.lang]||WW_LOAD_WARNING.en);
else if(!wwTemporary)wwSave();
if(WW_VIDEO)wwVideo();
if(!wwTemporary&&!savedDataInvalid&&!state.prefs.tourSeen)setTimeout(()=>wwTour(0),300);
$('#upgradeCard').hidden=!DEMO;
})();
